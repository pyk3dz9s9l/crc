name: tester-windows
jobs:
  windows-e2e-ocp:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.triggering_actor != 'dependabot[bot]'
    uses: pyk3dz9s9l/crc/.github/workflows/windows-qe-tpl.yml@main
    strategy:
      fail-fast: false
      matrix:
        qe-type:
        - e2e
        - integration
        preset:
        - openshift
        - microshift
        - all
        exclude:
        - qe-type: e2e
          preset: all
        - qe-type: integration
          preset: openshift
        - qe-type: integration
          preset: microshift
    with:
      trigger-workflow-run-id: ${{ github.event.workflow_run.id }}
      qe-type: ${{matrix.qe-type}}
      preset: ${{matrix.preset}}
    secrets: inherit
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_run:
    workflows:
    - Build Windows artifacts
    types:
    - completed
