name: tester-linux
jobs:
  linux-qe:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.triggering_actor != 'dependabot[bot]'
    uses: pyk3dz9s9l/crc/.github/workflows/linux-qe-template.yml@main
    strategy:
      fail-fast: false
      matrix:
        qe-type:
        - e2e
        - integration
        preset:
        - openshift
        - microshift
    with:
      trigger-workflow-run-id: ${{ github.event.workflow_run.id }}
      qe-type: ${{matrix.qe-type}}
      preset: ${{matrix.preset}}
    secrets: inherit
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_run:
    workflows:
    - Build Windows artifacts
    types:
    - completed
