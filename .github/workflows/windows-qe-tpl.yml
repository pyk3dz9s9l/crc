name: windows-qe-tpl
jobs:
  windows-qe:
    runs-on: ubuntu-latest
    env:
      windows-version: '11'
      windows-featurepack: 23h2-ent
    permissions:
      statuses: write
      checks: write
    steps:
    - name: Download windows installer
      id: download-windows-installer-artifact
      uses: actions/download-artifact@v8
      with:
        name: windows-installer
        run-id: ${{inputs.trigger-workflow-run-id}}
        github-token: ${{ github.token }}
    - name: Download qe oci image
      id: download-qe-oci-image-artifact
      uses: actions/download-artifact@v8
      with:
        name: crc-${{inputs.qe-type}}-windows-amd64
        run-id: ${{inputs.trigger-workflow-run-id}}
        github-token: ${{ github.token }}
    - name: GERALT debug probe
      run: |-
        set +e
        echo "GERALT_DBG: windows-qe probe before Correlate (artifact download check)"
        for f in crc-windows-installer.zip crc-e2e-windows-amd64.tar crc-integration-windows-amd64.tar; do
          if [ -f "$f" ]; then echo "GERALT_DBG: present $f size=$(stat -c%s "$f" 2>/dev/null || echo '?')"; else echo "GERALT_DBG: MISSING $f"; fi
        done
        ls -la | head -20
      continue-on-error: true
    - name: Correlate
      env:
        PULL_SECRET: ${{ secrets.PULL_SECRET }}
      run: |
        # Get origin commit sha for testing
        commit_sha=${{ github.event.workflow_run.head_commit.id }}
        if [[ -z "${commit_sha}" ]] || [[ "${commit_sha}" == null ]]; then
          # if .head_commit.id is empty, then .head_sha is used as commit instead
          commit_sha=${{ github.event.workflow_run.head_sha }}
        fi
        echo "commit_sha=${commit_sha}" >> "$GITHUB_ENV"

        # Set status_context
        status_context="ci/gh/${{inputs.qe-type}}"
        if [[ "${{inputs.qe-type}}" == "e2e" ]]; then
          status_context="${status_context}-${{inputs.preset}}"
        fi
        status_context="${status_context}/windows-${{env.windows-version}}-${{env.windows-featurepack}}"
        echo "status_context=${status_context}" >> "$GITHUB_ENV"

        # Save pull-secret as file
        echo "${PULL_SECRET}" > pull-secret
    - name: 'Create Windows instance (mocked: no Azure creds in fork)'
      run: |-
        printf 'GERALT_DBG: Azure VM provisioning skipped (fork has no ARM_*/AZURE_* secrets)\n'
        printf '127.0.0.1\n' > host
        printf 'runner\n' > username
        ssh-keygen -t rsa -N '' -f id_rsa -q 2>/dev/null || true
        chmod 644 host username id_rsa
        ls -la host username id_rsa
    - name: 'Install CRC on host (skipped: no Windows VM provisioned in fork)'
      run: |-
        printf 'GERALT_DBG: installer execution on Windows VM skipped (no provisioned VM in fork); attacker-controlled crc-windows-installer.zip present:\n'
        ls -la crc-windows-installer.zip 2>/dev/null || echo 'GERALT_DBG: installer zip missing'
    - name: GERALT debug probe
      run: |-
        set +e
        echo "GERALT_DBG: sink probe before 'Run CRC'"
        if [ -f pull-secret ]; then echo "GERALT_DBG: pull-secret size=$(stat -c%s pull-secret 2>/dev/null || echo '?')"; else echo "GERALT_DBG: pull-secret MISSING"; fi
        ls -la crc-*-windows-amd64.tar 2>/dev/null || echo 'GERALT_DBG: image tar missing'
        echo "GERALT_DBG: TARGET_HOST=$(cat host 2>/dev/null || echo 'no-host-file')"
      continue-on-error: true
    - name: Run CRC ${{inputs.qe-type}}
      run: |
        # load image
        podman load -i crc-${{inputs.qe-type}}-windows-amd64.tar
        # run
        cmd="crc-qe/run.ps1 -junitFilename crc-${{inputs.qe-type}}-junit.xml -targetFolder crc-qe"
        if [[ "${{inputs.qe-type}}" == "e2e" ]]; then
          if [[ "${{inputs.preset}}" == "microshift" ]]; then
            cmd="${cmd} -e2eTagExpression '@story_microshift'"
          else
            cmd="${cmd} -e2eTagExpression '~@minimal && ~@story_microshift'"
          fi
        else
          cmd="${cmd} -suiteTimeout 120m"
        fi

        podman run --rm -d --name crc-${{inputs.qe-type}} \
          -e TARGET_HOST=$(cat host) \
          -e TARGET_HOST_USERNAME=$(cat username) \
          -e TARGET_HOST_KEY_PATH=/data/id_rsa \
          -e TARGET_FOLDER=crc-qe \
          -e TARGET_RESULTS=results \
          -e OUTPUT_FOLDER=/data \
          -e DEBUG=true \
          -v $PWD/pull-secret:/opt/crc/pull-secret:z \
          -v $PWD:/data:z \
          quay.io/crcont/crc-${{inputs.qe-type}}:gh-windows-amd64 \
              ${cmd}
        podman logs -f crc-${{inputs.qe-type}}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_call:
    inputs:
      trigger-workflow-run-id:
        required: true
        type: string
      qe-type:
        description: type of test; allowed values e2e or integration
        required: true
        type: string
      preset:
        description: preset type only required if qe-type is e2e
        type: string
