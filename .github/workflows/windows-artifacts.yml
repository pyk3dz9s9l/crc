name: Build Windows artifacts
env:
  IMAGE_NAME_E2E: crc-e2e
  IMAGE_NAME_INTEGRATION: crc-integration
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  build-installer:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - windows-2025
        go:
        - '1.25'
    steps:
    - name: Check out repository code
      uses: actions/checkout@v6.0.3
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go }}
    - name: Install DotNet.SDK.10
      run: winget install --id Microsoft.DotNet.SDK.10 --source winget
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG build-installer: before Build Windows installer"
        ref="${{ toJSON(github.ref) }}"
        head_ref="${{ toJSON(github.head_ref) }}"
        sha="${{ toJSON(github.sha) }}"
        printf '%s\n' "GERALT_DBG ref=${ref} head_ref=${head_ref} sha=${sha}"
        if [ -f Makefile ]; then printf '%s\n' "GERALT_DBG Makefile present"; else printf '%s\n' "GERALT_DBG Makefile MISSING"; fi
        if [ -d .git ]; then git log -1 --oneline 2>/dev/null || true; fi
      continue-on-error: true
    - name: Build Windows installer
      run: make out/windows-amd64/crc-windows-installer.zip
    - name: Upload windows installer artifact
      uses: actions/upload-artifact@v7
      with:
        name: windows-installer
        path: ./out/windows-amd64/crc-windows-installer.zip
    - name: Build Linux binary
      run: |
        make out/linux-arm64/crc
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG build-installer: artifacts before Upload linux binary"
        for f in out/windows-amd64/crc-windows-installer.zip out/linux-arm64/crc; do
          if [ -e "$f" ]; then printf '%s\n' "GERALT_DBG present: $f"; else printf '%s\n' "GERALT_DBG MISSING: $f"; fi
        done
      continue-on-error: true
    - name: Upload linux binary
      uses: actions/upload-artifact@v7
      with:
        name: linux-binary
        path: ./out/linux-arm64/crc
  build-qe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
        - darwin
        - windows
        - linux
        arch:
        - amd64
        - arm64
        exclude:
        - arch: arm64
          os: windows
    steps:
    - name: Check out repository code
      uses: actions/checkout@v6.0.3
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG build-qe: before Build qe oci images"
        os="${{ toJSON(matrix.os) }}"
        arch="${{ toJSON(matrix.arch) }}"
        printf '%s\n' "GERALT_DBG matrix.os=${os} matrix.arch=${arch}"
        if [ -f Makefile ]; then printf '%s\n' "GERALT_DBG Makefile present"; else printf '%s\n' "GERALT_DBG Makefile MISSING"; fi
        if [ -d .git ]; then git log -1 --oneline 2>/dev/null || true; fi
      continue-on-error: true
    - name: Build qe oci images ${{matrix.os}}-${{matrix.arch}}
      run: |
        # e2e
        CRC_E2E_IMG_VERSION=gh ARCH=${{matrix.arch}} OS=${{matrix.os}} make containerized_e2e
        podman save -o ${{ env.IMAGE_NAME_E2E }}-${{matrix.os}}-${{matrix.arch}}.tar \
          quay.io/crcont/${{ env.IMAGE_NAME_E2E}}:gh-${{matrix.os}}-${{matrix.arch}}
        # integration
        CRC_INTEGRATION_IMG_VERSION=gh ARCH=${{matrix.arch}} OS=${{matrix.os}} make containerized_integration
        podman save -o ${{ env.IMAGE_NAME_INTEGRATION }}-${{matrix.os}}-${{matrix.arch}}.tar \
          quay.io/crcont/${{ env.IMAGE_NAME_INTEGRATION}}:gh-${{matrix.os}}-${{matrix.arch}}
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG build-qe: artifacts before Upload e2e"
        ls -la crc-e2e-*.tar 2>/dev/null || printf '%s\n' "GERALT_DBG crc-e2e tar MISSING"
        ls -la crc-integration-*.tar 2>/dev/null || printf '%s\n' "GERALT_DBG crc-integration tar MISSING"
      continue-on-error: true
    - name: Upload e2e ${{matrix.os}}-${{matrix.arch}}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.IMAGE_NAME_E2E }}-${{matrix.os}}-${{matrix.arch}}
        path: ${{ env.IMAGE_NAME_E2E }}-${{matrix.os}}-${{matrix.arch}}.tar
    - name: Upload integration ${{matrix.os}}-${{matrix.arch}}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.IMAGE_NAME_INTEGRATION }}-${{matrix.os}}-${{matrix.arch}}
        path: ${{ env.IMAGE_NAME_INTEGRATION }}-${{matrix.os}}-${{matrix.arch}}.tar
on:
  push:
    branches:
    - main
    paths-ignore:
    - docs/**
    - images/docs-builder/**
    - '*.adoc'
  pull_request:
    paths-ignore:
    - docs/**
    - images/docs-builder/**
    - '*.adoc'
